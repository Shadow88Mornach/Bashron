[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bashron"
version = "0.1.0"
description = "Warrior-class bash script scheduler — friendly time formats, live dashboard, zero cron syntax."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["cli", "bash", "scheduler", "cron", "automation", "launchd", "systemd", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "schedule>=1.2.0",
]

[project.scripts]
bashron = "bashron.cli:app"

[project.urls]
Homepage = "https://github.com/shadowmornachAsia/Bashron"
Repository = "https://github.com/shadowmornachAsia/Bashron"
Issues = "https://github.com/shadowmornachAsia/Bashron/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bashron"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bashron --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["bashron"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
